<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITS MANAGER PRO</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:20px}
header small{opacity:.7}
nav{background:white;display:flex;gap:5px;padding:10px;overflow-x:auto;position:sticky;top:60px;z-index:9;box-shadow:0 2px 5px rgba(0,0,0,.05)}
nav button{border:0;background:#e2e8f0;padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:bold}
nav button.active{background:#0f172a;color:white}
main{padding:15px;max-width:1100px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:white;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer}
.card b{font-size:22px;display:block}
.card span{color:#64748b;font-size:13px}
.card small{color:#dc2626;font-weight:bold}
section{background:white;padding:15px;border-radius:12px;margin-top:15px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #cbd5e1;border-radius:8px}
button.btn{background:#0f172a;color:white;border:0;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
button.btn-green{background:#16a34a}
button.btn-red{background:#dc2626}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}
.badge{padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold}
.badge-red{background:#fee2e2;color:#dc2626}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-green{background:#dcfce7;color:#166534}
.hidden{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<div>
<h1 id="shopName">🛍️ Ma Boutique</h1>
<small id="shopPhone">Nouakchott - Mauritanie</small>
</div>
<button class="btn" onclick="showPage('parametres')">⚙️ Paramètres</button>
</header>

<nav>
<button onclick="showPage('dashboard')" id="btn-dashboard" class="active">📊 Tableau de bord</button>
<button onclick="showPage('produits')" id="btn-produits">📦 Produits</button>
<button onclick="showPage('caisse')" id="btn-caisse">💰 Caisse</button>
<button onclick="showPage('clients')" id="btn-clients">👥 Clients</button>
<button onclick="showPage('rapports')" id="btn-rapports">📈 Rapports</button>
<button onclick="showPage('parametres')" id="btn-parametres">⚙️ Paramètres</button>
</nav>

<main>
<!-- DASHBOARD -->
<div id="page-dashboard">
<div class="cards">
<div class="card" onclick="filterProd('all')"><span>Total Produits</span><b id="kpiProd">0</b></div>
<div class="card" onclick="filterProd('empty')"><span>Ruptures</span><b id="kpiEmpty" style="color:#dc2626">0</b><small id="kpiEmptyTxt">Cliquez pour voir</small></div>
<div class="card" onclick="filterProd('low')"><span>Stock Faible</span><b id="kpiLow" style="color:#d97706">0</b></div>
<div class="card"><span>Chiffre d'affaires</span><b id="kpiCA">0 MRU</b></div>
<div class="card"><span>Marge</span><b id="kpiMarge" style="color:#16a34a">0 MRU</b></div>
</div>
<section>
<h3>🔔 Alertes Stock</h3>
<div id="alerts">Aucune alerte pour le moment.</div>
</section>
</div>

<!-- PRODUITS -->
<div id="page-produits" class="hidden">
<section>
<h3>📦 Ajouter un produit</h3>
<div class="grid2">
<input id="pNom" placeholder="Nom du produit ex: Routeur TP-Link">
<input id="pRef" placeholder="Référence ex: RT-001">
<input id="pAchat" type="number" placeholder="Prix d'achat">
<input id="pVente" type="number" placeholder="Prix de vente">
<input id="pStock" type="number" placeholder="Stock initial">
<input id="pSeuil" type="number" placeholder="Seuil d'alerte ex: 5">
</div>
<button class="btn btn-green" onclick="addProd()">➕ Ajouter Produit</button>
<div id="filterBanner" class="hidden" style="background:#fef9c3;padding:10px;border-radius:8px;margin-top:10px">Filtre actif : <b id="filterTxt"></b> <button onclick="filterProd('all')">Voir tout</button></div>
</section>
<section>
<h3>Liste des produits</h3>
<input id="searchProd" placeholder="🔍 Rechercher un produit..." oninput="renderProd()">
<div style="overflow-x:auto"><table><thead><tr><th>Produit</th><th>Réf</th><th>Achat</th><th>Vente</th><th>Stock</th><th>Action</th></tr></thead><tbody id="prodTable"></tbody></table></div>
</section>
</div>
